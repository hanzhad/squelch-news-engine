# Where a ready article ends up.
#
# Every channel is independent: it picks up issues at status:3-ready that do not
# carry its own `sent:<id>` label yet, delivers them, and marks them. Only when
# every enabled channel has marked an issue does it become status:4-published
# and close. So the open issue list is exactly what still owes somebody a
# delivery, and a broken channel holds up nothing but itself.
#
# Disabling a channel takes it out of that count immediately, so articles stop
# waiting for it. Enabling one only affects articles that are still ready:
# anything already published stays published, which is deliberate — a new
# channel should start with today's news, not replay the whole archive.
#
# Adding a channel here also means re-running `squelch bootstrap-labels`.

channels:
  # The static archive on GitHub Pages: the permanent, public record.
  - id: site
    enabled: true
  # The RSS feed built alongside it. Separate from the page because it is
  # separately fallible — it holds only the most recent entries and skips
  # anything without a link, so "on the page" and "in the feed" genuinely differ.
  - id: rss
    enabled: true
  # The article-by-article stream — every survivor, as it lands. Public, and
  # read from the roundups rather than from the top: each highlight in a digest
  # links to this channel's post about that article, so the discussion has one
  # home instead of restarting under every summary. That is what `link_channel`
  # in feed.yaml points at, and it is why the delivery pass records a message
  # URL here and not only an id.
  #
  # Still nothing falls back to this webhook. A roundup posted into the stream
  # would be buried by the next article within the hour, which is a different
  # failure from the one the closed channel had but the same outcome.
  #
  # Skill-collection repositories are routed to their own channel below, so
  # they are skipped here — by label, which is why both the topic (the
  # classifier's tag) and the source (set at scrape time) are listed: either
  # one is enough to reroute an article.
  - id: discord
    enabled: true
    skip: ["topic:claude-skills", "source:claude-skills"]
    # How much of the channel an article gets, by the score the classifier gave
    # it. Only Discord reads this: a chat channel is skimmed while it scrolls
    # past, so weight is the only way to say "this one matters". The site and
    # the feed are read on purpose and give everything the same room.
    #
    #   lead      full-width picture, summary, topic line
    #   standard  small picture on the right, same text
    #   brief     headline and one line, no picture
    #
    # Every article is still posted — only its size changes, and it links to
    # the same places either way. Raise `lead` if too much of the channel is
    # shouting; set `standard: 0` to switch the compact tier off entirely.
    emphasis:
      lead: 7
      standard: 4
  # The skills rubric: repositories of Claude Code skills and plugins that are
  # gathering stars, posted to a channel of their own so the hype never
  # competes with the news. Routing is by label — `only` here mirrors the
  # `skip` above, and the closing pass counts for each article exactly the
  # channels it was routed to. Needs the DISCORD_SKILLS_WEBHOOK_URL secret.
  # A forum, not a text channel: a skill collection is something you try and
  # then argue about, so each repository gets a post of its own with the
  # discussion attached, instead of scrolling away behind the next one. This
  # must match what the channel actually is in Discord — a forum refuses a
  # message with no thread name, a text channel refuses one that has it.
  - id: discord-skills
    enabled: true
    forum: true
    only: ["topic:claude-skills", "source:claude-skills"]
    # The rubric's point: the post is the repository, and the first reply is a
    # reading of it — every skill that actually exists in the files, what it
    # does, and whether the collection is what it says it is. A separate LLM
    # stage writes it (prompts/review.md) and the publisher posts it
    # into the thread the article just opened, so the argument starts under the
    # analysis rather than under a link.
    #
    # It is published as written, including when it is damning. Nothing in it
    # decides whether the article runs — the classifier already made that call,
    # and a second silent gate is exactly what this feed is against.
    #
    # Switching this off stops the extra LLM call as well as the reply.
    review: true
    # Which issue label becomes which forum tag. The ids are Discord's, not
    # ours, and they are not secrets — they name nothing and open nothing — so
    # they live here rather than in the environment. There is also no way to
    # look them up: no webhook endpoint lists a forum's tags, so this mapping
    # is written once by hand and only changes when a tag is recreated.
    #
    # Order matters. Discord accepts at most five tags on a post and an article
    # can carry more topics than that, so the overflow is decided here, most
    # telling first, rather than by whatever a set happens to yield. A label
    # with no entry costs nothing — it is simply not tagged — which is what
    # keeps adding a topic to feed.yaml from breaking this channel.
    tags:
      "topic:tooling": "1536677352002560000"
      "topic:open-source": "1536677538833899550"
      "topic:models": "1536677793474027581"
      "topic:research": "1536677875602686033"
      "topic:security": "1536677963444133918"
      "topic:product": "1536678111393873970"

  # The community window onto what the classifier threw away, in its own
  # channel of the same server. Consumes status:rejected instead of ready, so
  # it never takes part in the count that closes an issue — rejections are
  # closed already. Each post carries the rejection reason and an invitation
  # to react 👍 on the issue; enough reactions and the rescue pass sends the
  # article back into the pipeline as status:2-relevant.
  # Needs the DISCORD_REJECTED_WEBHOOK_URL secret; disable here to switch the
  # section off without touching the workflow.
  - id: discord-rejected
    enabled: true
    consumes: rejected

  # The roundups — a daily every morning and a look back on Mondays, both into
  # the one channel that is actually meant to be read. `consumes: digest` puts
  # it on a queue no article is ever in: the build stage writes a roundup as an
  # issue of its own, this channel posts it and records the message id, and the
  # closing pass shuts it. So it never takes part in closing an article, and a
  # dead webhook here holds up nothing but the roundups themselves.
  # Needs the DISCORD_DIGEST_WEBHOOK_URL secret; DIGEST_FORUM says whether the
  # channel is a forum, since a roundup post has to be named there.
  - id: discord-digest
    enabled: true
    consumes: digest

  # The community forum — #tokens-overflow in the same server — and the only
  # channel the pipeline reads as well as writes. People post their own
  # experiments there; the ingest opens an issue per post, a second stage writes
  # a reading of it, and a third posts that reading back inside the thread.
  #
  # `consumes: cases` is a queue no article is ever in, exactly like the
  # roundups: it never counts towards closing an article, and a broken forum
  # holds up nothing but the forum.
  #
  # `forum_url` is the one address in this file, and it is here rather than in
  # the environment for the same reason the tag ids are: it names a public
  # channel and unlocks nothing. What actually grants access is the bot token,
  # DISCORD_BOT_TOKEN — the only credential here that can read a channel, since
  # a webhook cannot. Point it at another channel and the pipeline follows;
  # renaming the channel in Discord changes nothing, since this is its id.
  #
  # Nothing in this channel is filtered. Every post in the window gets an issue
  # and an answer, including the thin ones — a forum where the bot picks which
  # of your write-ups deserve a reply is a forum people stop posting in.
  - id: discord-cases
    enabled: true
    consumes: cases
    forum: true
    forum_url: https://discord.com/channels/1536359042316898404/1537215873452998826

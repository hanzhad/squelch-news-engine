# Editorial policy and source catalogue.
#
# `focus` is the main knob: it goes straight into the filter prompt and decides
# what survives. Rewrite it in plain language, not keywords.

# Public name of the feed: masthead, RSS channel title, digest header. This is
# the community's brand, independent of what the repository is called.
title: Squelch

focus: |
  Substantive news about AI, software engineering and the infrastructure around
  them, for readers who are tired of hype.

  Let through: model and tool releases with concrete capabilities or pricing,
  technical write-ups with real detail, security incidents and vulnerabilities,
  infrastructure and outage post-mortems, funding or policy news that visibly
  changes what practitioners can build, and honest negative results.

  Filter out: speculation about the future with no new facts, "X will change
  everything" opinion pieces, listicles and prompt-tip roundups, course and
  newsletter promotion, repackaged press releases with nothing added, personal
  branding threads, and anything whose whole content is an unnamed source
  claiming a model is coming.

# The LLM may only tag from this list, which keeps the label set finite.
topics:
  - models
  - tooling
  - research
  - security
  - infrastructure
  - product
  - policy
  - open-source
  - hardware

# Article text handed to the LLM is truncated to this many characters.
max_body_chars: 8000

sources:
  # -- labs and vendors, first-hand ----------------------------------------

  # Anthropic publishes no feed, but its newsroom is server-rendered, so it
  # needs a selector rather than a browser.
  - id: anthropic
    type: html
    url: https://www.anthropic.com/news
    link_selector: 'a[href^="/news/"]'
    max_items: 8

  # The product blog lives on a separate domain and also has no feed.
  - id: claude
    type: html
    url: https://claude.com/blog
    link_selector: 'a[href^="/blog/"]'
    max_items: 5

  - id: openaidevs
    type: rss
    url: https://developers.openai.com/rss.xml
    max_items: 4

  - id: googleai
    type: rss
    url: https://blog.google/technology/ai/rss/
    max_items: 5

  - id: deepmind
    type: rss
    url: https://deepmind.google/blog/rss.xml
    max_items: 5

  # Meta rejects a browser-like Accept header with a 400 but serves the page
  # fine with the default */*, which is what our client sends. Links here are
  # absolute, so the selector matches on substring rather than prefix.
  - id: metaai
    type: html
    url: https://ai.meta.com/blog/
    link_selector: 'a[href*="/blog/"]'
    max_items: 4

  - id: microsoft
    type: rss
    url: https://blogs.microsoft.com/feed/
    max_items: 4

  - id: msresearch
    type: rss
    url: https://www.microsoft.com/en-us/research/feed/
    max_items: 4

  - id: msdevblogs
    type: rss
    url: https://devblogs.microsoft.com/ai/feed/
    max_items: 4

  - id: mistral
    type: rss
    url: https://mistral.ai/news/rss
    max_items: 4

  - id: allenai
    type: rss
    url: https://allenai.org/rss.xml
    max_items: 4

  - id: nvidia
    type: rss
    url: https://developer.nvidia.com/blog/feed/
    max_items: 4

  - id: nebius
    type: html
    url: https://nebius.com/blog
    link_selector: 'a[href^="/blog/posts/"]'
    max_items: 4

  - id: huggingface
    type: rss
    url: https://huggingface.co/blog/feed.xml
    max_items: 5

  # Daily papers. Article ids start with the arXiv year, which is what keeps
  # the selector off /papers/trending and /papers/date/...
  - id: hfpapers
    type: html
    url: https://huggingface.co/papers
    link_selector: 'a[href^="/papers/2"]'
    max_items: 5

  # xAI sits behind Cloudflare and returns 403 to plain HTTP even with a
  # browser user agent, so it needs a real browser and may still be blocked
  # from CI addresses. Left off until that is settled.
  - id: xai
    type: web
    url: https://x.ai/news
    link_selector: 'a[href^="/news/"]'
    max_items: 5
    enabled: false

  # -- independent writing and press ---------------------------------------

  - id: raschka
    type: rss
    url: https://magazine.sebastianraschka.com/feed
    max_items: 3

  - id: techreview
    type: rss
    url: https://www.technologyreview.com/feed/
    max_items: 5

  - id: techcrunchai
    type: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    max_items: 5

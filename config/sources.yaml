# The source catalogue. Ids become `source:<id>` labels, so keep them ASCII
# and stable — renaming one makes its old issues look like a different source.
#
# type: rss     a feed URL
# type: html    a server-rendered listing page plus link_selector
# type: web     a listing page that needs a real browser (Playwright extra)
# type: github  a repository search page; its q= runs against the API
#
# Editorial policy lives in feed.yaml; which model reads them, in models.yaml.

sources:
  # -- labs and vendors, first-hand ----------------------------------------

  # Anthropic publishes no feed, but its newsroom is server-rendered, so it
  # needs a selector rather than a browser.
  - id: anthropic
    type: html
    url: https://www.anthropic.com/news
    link_selector: 'a[href^="/news/"]'
    max_items: 8

  # The product blog lives on a separate domain and also has no feed.
  - id: claude
    type: html
    url: https://claude.com/blog
    link_selector: 'a[href^="/blog/"]'
    max_items: 5

  - id: openaidevs
    type: rss
    url: https://developers.openai.com/rss.xml
    max_items: 4

  - id: googleai
    type: rss
    url: https://blog.google/technology/ai/rss/
    max_items: 5

  - id: deepmind
    type: rss
    url: https://deepmind.google/blog/rss.xml
    max_items: 5

  # Meta rejects a browser-like Accept header with a 400 but serves the page
  # fine with the default */*, which is what our client sends. Links here are
  # absolute, so the selector matches on substring rather than prefix.
  - id: metaai
    type: html
    url: https://ai.meta.com/blog/
    link_selector: 'a[href*="/blog/"]'
    max_items: 4

  - id: microsoft
    type: rss
    url: https://blogs.microsoft.com/feed/
    max_items: 4

  - id: msresearch
    type: rss
    url: https://www.microsoft.com/en-us/research/feed/
    max_items: 4

  # Was /ai/feed/ until that page stopped being an archive: WordPress then
  # serves the *comments* feed for it, which parses fine and is permanently
  # empty. The AI writing moved to the Foundry blog. Id kept as it is, so the
  # existing source:msdevblogs issues stay one source.
  - id: msdevblogs
    type: rss
    url: https://devblogs.microsoft.com/foundry/feed/
    max_items: 4

  - id: mistral
    type: rss
    url: https://mistral.ai/news/rss
    max_items: 4

  - id: allenai
    type: rss
    url: https://allenai.org/rss.xml
    max_items: 4

  - id: nvidia
    type: rss
    url: https://developer.nvidia.com/blog/feed/
    max_items: 4

  - id: nebius
    type: html
    url: https://nebius.com/blog
    link_selector: 'a[href^="/blog/posts/"]'
    max_items: 4

  - id: huggingface
    type: rss
    url: https://huggingface.co/blog/feed.xml
    max_items: 5

  # Daily papers. Article ids start with the arXiv year, which is what keeps
  # the selector off /papers/trending and /papers/date/...
  - id: hfpapers
    type: html
    url: https://huggingface.co/papers
    link_selector: 'a[href^="/papers/2"]'
    max_items: 5

  # xAI sits behind Cloudflare and returns 403 to plain HTTP even with a
  # browser user agent, so it needs a real browser and may still be blocked
  # from CI addresses. Left off until that is settled.
  - id: xai
    type: web
    url: https://x.ai/news
    link_selector: 'a[href^="/news/"]'
    max_items: 5
    enabled: false

  # -- ecosystem: skill and plugin repositories -----------------------------

  # Skill collections for Claude Code are announced nowhere and hyped
  # everywhere (TikTok included); the only reliable signal is the repository
  # appearing and gathering stars. The q= of this search URL is what the API
  # runs — the scraper bounds it to repositories created within max_age_days
  # and sorts by stars, so what surfaces is "the new repos people actually
  # flocked to". The page itself stays clickable for humans. The article body
  # is the repo's own README and SKILL.md files plus hard numbers; nothing
  # from the repository is ever executed.
  - id: claude-skills
    type: github
    url: https://github.com/search?q=claude+skills+in%3Aname%2Cdescription&type=repositories
    max_items: 5

  # -- independent writing and press ---------------------------------------

  - id: raschka
    type: rss
    url: https://magazine.sebastianraschka.com/feed
    max_items: 3

  - id: techreview
    type: rss
    url: https://www.technologyreview.com/feed/
    max_items: 5

  - id: techcrunchai
    type: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    max_items: 5

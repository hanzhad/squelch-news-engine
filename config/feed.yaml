# What this feed is: its name, what it lets through, and how it labels things.
#
# `focus` is the main knob. It is quoted verbatim into the classifier prompt,
# so it — not a threshold and not the code — decides what survives. Write it in
# plain language, and always as two lists: what to let through, what to cut.
#
# Sources live in sources.yaml, models in models.yaml, and the prompt wording in
# the top-level prompts/ directory.

# Public name of the feed: masthead, RSS channel title, digest header. This is
# the community's brand, independent of what the repository is called.
title: Squelch

focus: |
  Substantive news about AI, software engineering and the infrastructure around
  them, for readers who are tired of hype.

  Let through: model and tool releases with concrete capabilities or pricing,
  technical write-ups with real detail, security incidents and vulnerabilities,
  infrastructure and outage post-mortems, funding or policy news that visibly
  changes what practitioners can build, and honest negative results. Also new
  repositories of skills, plugins or extensions for coding agents — but only
  when the listed contents show real, inspectable substance; tag these
  claude-skills.

  Filter out: speculation about the future with no new facts, "X will change
  everything" opinion pieces, listicles and prompt-tip roundups, course and
  newsletter promotion, repackaged press releases with nothing added, personal
  branding threads, anything whose whole content is an unnamed source claiming
  a model is coming, and skill repositories that are empty shells — a README
  of emoji and promises, forked collections of other people's skills, or
  nothing but install instructions.

# The LLM may only tag from this list, which keeps the label set finite.
topics:
  - models
  - tooling
  - research
  - security
  - infrastructure
  - product
  - policy
  - open-source
  - hardware
  # Skill/plugin collections for coding agents; routes articles to their own
  # Discord channel — see `only`/`skip` in delivery.yaml.
  - claude-skills

# How far back an article may be dated and still be treated as news. Listing
# pages keep months of posts on them, so without this every newly added source
# opens its whole back catalogue on the day it is enabled. Articles the page
# gives no date for are let through — unknown is not the same as old.
# Raise it when adding a source whose archive is worth importing on purpose.
max_age_days: 21

# Article text handed to the summariser is truncated to this many characters.
# The classifier reads far less — see classify_body_chars in core/settings.py.
max_body_chars: 8000

# How much of the window a roundup carries. Both roundups read the same knobs;
# what differs between the daily and the weekly is the window, not the policy.
#
# The two settings only mean anything together. `max_articles` is the size the
# roundup aims for, `min_score` is what an article must be worth to get in past
# that size — so a late-ranked article that scored well still makes it, and
# nothing is cut for being number sixty-one alone.
#
# `min_score: 0` keeps everything, which makes the cap inert. That is the
# shipped setting on purpose: at roughly fifteen articles a day a week does not
# yet need rationing, and a threshold nobody chose deliberately is the silent
# filter this pipeline exists to avoid. Raise it — 3 or 4 — the day a week
# genuinely stops fitting, and the log will say what it cost.
digest:
  max_articles: 60
  min_score: 0
  # Where a highlight's link lands. The roundup is the way into the
  # article-by-article channel rather than a replacement for it, so a link goes
  # to that channel's own post about the article — with whatever discussion has
  # gathered under it — and only falls back to the publisher's page for what the
  # feed has not carried yet. Set it empty to link straight to the articles.
  link_channel: discord
  # Each article reaches the model as its published write-up, cut to this at a
  # word boundary. Stage two writes two to four sentences, so this leaves a
  # normal summary whole; it is also what bounds an issue opened by hand, which
  # has no summary and falls back to max_body_chars of raw text.
  summary_chars: 1000

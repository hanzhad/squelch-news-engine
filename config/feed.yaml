# What this feed is: its name, what it lets through, and how it labels things.
#
# `focus` is the main knob. It is quoted verbatim into the classifier prompt,
# so it — not a threshold and not the code — decides what survives. Write it in
# plain language, and always as two lists: what to let through, what to cut.
#
# Sources live in sources.yaml, models in models.yaml, prompt wording in
# prompts/.

# Public name of the feed: masthead, RSS channel title, digest header. This is
# the community's brand, independent of what the repository is called.
title: Squelch

focus: |
  Substantive news about AI, software engineering and the infrastructure around
  them, for readers who are tired of hype.

  Let through: model and tool releases with concrete capabilities or pricing,
  technical write-ups with real detail, security incidents and vulnerabilities,
  infrastructure and outage post-mortems, funding or policy news that visibly
  changes what practitioners can build, and honest negative results.

  Filter out: speculation about the future with no new facts, "X will change
  everything" opinion pieces, listicles and prompt-tip roundups, course and
  newsletter promotion, repackaged press releases with nothing added, personal
  branding threads, and anything whose whole content is an unnamed source
  claiming a model is coming.

# The LLM may only tag from this list, which keeps the label set finite.
topics:
  - models
  - tooling
  - research
  - security
  - infrastructure
  - product
  - policy
  - open-source
  - hardware

# How far back an article may be dated and still be treated as news. Listing
# pages keep months of posts on them, so without this every newly added source
# opens its whole back catalogue on the day it is enabled. Articles the page
# gives no date for are let through — unknown is not the same as old.
# Raise it when adding a source whose archive is worth importing on purpose.
max_age_days: 21

# Article text handed to the summariser is truncated to this many characters.
# The classifier reads far less — see classify_body_chars in core/settings.py.
max_body_chars: 8000

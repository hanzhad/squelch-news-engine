# Which model runs each stage.
#
# Google retires model ids on its own schedule — we already lost 1.5 Flash and
# 2.0 Flash — so they live here rather than buried in the code. The env vars
# GEMINI_CLASSIFY_MODEL and GEMINI_MODEL override these when set, which is how
# you try a new one without a commit.
#
# The free tier meters requests per day, per model, and the ceilings differ by
# an order of magnitude: the lite models allow 500 a day, the full Flash models
# allow 20. Requests — not tokens. We peak around 5% of the token allowance
# and still ran out of day, so which model a stage sits on is a capacity
# decision before it is a quality one.
#
# One warning about the override above: GEMINI_MODEL is read by summarize, case
# and digest alike, so setting it anywhere those stages share — a local .env, a
# repository variable — moves all three. Pointing it at a full Flash model puts
# the case stage, which runs every twenty minutes, under a 20-a-day ceiling. Per
# stage it is safe only where one stage owns the environment: the digest
# workflows pass their `model` dispatch input as GEMINI_MODEL in their own job,
# which is the way to try a model on one roundup without touching this file.

# Stage one judges every scraped article against the policy. Google's own model
# card names this workload — "high-volume, latency-sensitive tasks like
# translation and classification" — and 3.5 Flash-Lite beats the 3.1 it
# replaces across every published benchmark by 12 to 23 points.
#
# This is also the stage to spend quality on. A misjudgement here is silent and
# final: a rejected article closes as not_planned and nobody ever learns what
# was thrown away. A weak summary, by contrast, is visible in the channel and
# can be regenerated.
classify: gemini-3.5-flash-lite

# Stage two writes prose, and only ever sees articles that survived stage one.
# On the same model as classify on purpose. The alternative — a second lite
# model, for a second 500-a-day budget — buys isolation we do not need (a heavy
# day is about 113 requests across both stages) at the cost of a markedly weaker
# model. The two stages also run on different cron slots, so they never share a
# per-minute allowance either.
summarize: gemini-3.5-flash-lite

# The skills rubric's own stage: read a repository's files and say, skill by
# skill, whether there is anything behind them.
#
# Started on gemini-3.6-flash, on the theory that judgement needs the stronger
# model. Measured instead, over the repositories the feed had already seen: the
# two models returned the same verdict on every one, including the case that
# actually matters — a directory of links to other people's skills with 800
# stars and no SKILL.md of its own, which the lite model called hype, with an
# empty skill list and a sentence naming exactly why. The stronger model's only
# edge was a more balanced note on who might still want that link list.
#
# So the lite model does this job, and the difference it buys is capacity: 500
# requests a day rather than 20 shared with the digest. What limits the quality
# of a review here is the prompt, not the parameter count.
review: gemini-3.5-flash-lite

# The reply to one community case, in the forum, under somebody's own post.
#
# On the lite model for the same reason as the rubric — capacity — and with one
# extra consideration that pushes the same way: a case gets answered while the
# person who wrote it is still around, so the stage runs every twenty minutes
# rather than once a day. Twenty requests a day would be gone by lunchtime.
#
# Note what this stage is not asked to do: it never checks a fact, only names
# what would check it. That is a prompt guarantee rather than a model one, and
# it is why a stronger model would buy less here than it looks — see prompts/case.md.
case: gemini-3.5-flash-lite

# Both roundups, daily and weekly, and the only stage doing real synthesis:
# turning eight articles into two trends is harder than restating one. Since the
# per-article feed became our own working channel this is also the part anyone
# actually reads, which settles the quality question.
#
# The capacity question settles just as easily: one request a day, two on the
# Monday the weekly joins it, against a budget of twenty. The daily costs a
# twentieth of the ceiling and leaves the manual-dispatch escape hatch intact.
#
# Moved from 3.6 to 3.7 Flash on the day 3.7 shipped, and the move is free
# rather than earned: same 20-a-day ceiling, so nothing about the budget above
# changes. Not measured against 3.6 on our own roundups — 3.7 is pitched at code
# and agent work, which is not what this stage does, so treat the quality of it
# as an open question. `squelch digest` writes into the issue and
# `squelch publish-digest` sends it, so a bad roundup is visible before anyone
# reads it; if the prose turns out worse, this line goes back to gemini-3.6-flash.
digest: gemini-3.7-flash

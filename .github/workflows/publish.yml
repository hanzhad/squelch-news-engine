name: publish

on:
  schedule:
    # Every stage owns its own five-minute slot — scrape :00/:30, classify
    # :10/:40, summarize :20/:50, publish here, close :15/:35/:55 — so no two
    # ever fire on the same minute and queue behind each other on the runner.
    - cron: "5,25,45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: publish
  # Never cancel: the window between "posted to Discord" and "labelled
  # published" is exactly where a cancellation would cause a double post.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Comfortably inside the 15-minute cadence, so runs never queue up.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: squelch publish

name: digest / 1 write daily

# The morning roundup, into the same channel as the weekly one. Its own
# workflow rather than a second cron on digest-1-write-weekly.yml: two schedules
# in one file would have to work out which of them fired before they could pick a
# period, and a daily that can be re-run by hand without also re-running the week
# is worth the duplicated forty lines.

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # 06:00 UTC, over the day that just ended. Well clear of the weekly's Monday slot, so a reader
    # never gets both in the same minute. Writes into an issue and stops; digest-2-publish posts it.
    # The 08:00 slot is the same run again, blind to whether the first one worked: every other stage
    # runs again within the hour, so a bad minute costs it minutes, while this one runs once and a
    # bad minute costs the whole day — as it did on 13 August 2026. run_digest refuses to build a
    # second roundup for a day that already has one, before it writes a prompt, so on a normal day
    # this spends a runner minute and no model request. It stays inside the same UTC day because
    # that guard is keyed on one, and clear of 09:00 because that is the weekly's.
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    # schedule:end
  workflow_dispatch:
    inputs:
      model:
        description: >-
          Gemini model to write this digest with. Blank uses config/models.yaml.
          Free-tier quota is counted per model, so a second model is also the
          way to get a digest out when the usual one is spent.
        required: false
        default: ""
      days:
        description: >-
          Look back this many days instead of one. For catching up after an
          outage: the daily prompt never names its window, so a wider one is
          not a lie. Blank means one day.
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: digest-write-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      # Writes the roundup into an issue and stops there; digest-2-publish.yml
      # posts it. Running this twice in a day is safe — the second run finds
      # today's roundup already waiting and writes nothing.
      - name: Daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          # Through the environment rather than interpolated into the command.
          # A dispatch input is free text, and `${{ }}` inside `run:` is
          # substituted before the shell sees it — so a value with a semicolon
          # in it would run as a second command, with both secrets above in
          # scope.
          DAYS: ${{ inputs.days }}
        # A quiet day is a normal outcome here and leaves the run green — with
        # a daily roundup that is a common one, not an edge case.
        run: |
          if [ -n "$DAYS" ]; then
            squelch digest --period daily --days "$DAYS"
          else
            squelch digest --period daily
          fi

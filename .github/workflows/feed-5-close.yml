name: feed / 5 close delivered

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Three times an hour, sharing the :x4 class with answer and rescue. Costs nobody a request and
    # is idempotent by construction — a pass with nothing fully delivered reads labels and stops —
    # so the only thing this cadence decides is how long an issue sits open after its last channel
    # took it, which is the cheapest thing on the grid to be slow about. It gave its faster slots to
    # `cases-2-read`.
    - cron: "9,29,49 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feed-close
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    # Nothing here talks to a model or a webhook, so a slow run means GitHub is
    # slow, and waiting out the next tick is cheaper than waiting here.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      # Whoever delivers last does not close the issue: it could die in that
      # window and strand the article open with no queue left to find it. This
      # re-reads the labels instead, so a missed close costs one tick.
      - name: Close delivered
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: squelch close-delivered

name: cases / 3 answer

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Every ten minutes. Posting a reading that is already written reaches no model, so once
    # `cases-2-read` has spent its request there is nothing left to ration — but the reply is
    # already only ten minutes behind the reading, and the spare slots buy `cases-2-read` its own
    # class, which is where the real wait was.
    - cron: "4,14,24,34,44,54 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cases-answer
  # Never cancel. The window between "the reply is in the thread" and "the
  # issue says so" is exactly where a cancellation would put a second reply
  # under somebody's post — the one mistake this channel cannot take back.
  cancel-in-progress: false

jobs:
  answer-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Answer in the forum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same bot that read the forum posts the reply, so the answer
          # comes from an account people can see, mute and argue with rather
          # than from an anonymous webhook.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: squelch answer-cases

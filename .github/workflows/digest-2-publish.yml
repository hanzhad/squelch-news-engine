name: digest / 2 publish

# Posts the roundups that `digest / 1 write daily` and `… weekly` left waiting
# in the queue. Split from the writing so the model's answer survives a dead
# webhook and can be edited before it goes out.

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Three times an hour. Reaches no model — the answer is already sitting in an issue — so its
    # only job is to be the thing that retries, and a retry loop is worth running as often as the
    # grid allows: a webhook that was down at 06:00 costs the daily twenty minutes, not an hour.
    - cron: "15,35,55 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: digest-publish
  # Never cancel: the window between "posted to Discord" and "labelled sent"
  # is exactly where a cancellation would cause a double post.
  cancel-in-progress: false

jobs:
  publish-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Publish digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The channel both roundups go to. Required: there is no fallback to
          # the feed webhook, because the feed channel is ours to work in
          # rather than the one people read.
          DISCORD_DIGEST_WEBHOOK_URL: ${{ secrets.DISCORD_DIGEST_WEBHOOK_URL }}
          # Whether that channel is a forum, where a roundup becomes a post of
          # its own named after its headline. Not a secret — it says nothing an
          # invite would not — so it is a repository variable.
          DIGEST_FORUM: ${{ vars.DIGEST_FORUM }}
        run: squelch publish-digest

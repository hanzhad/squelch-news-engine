name: feed / 2 classify

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Ten minutes behind scrape, so it always finds the issues that run created. Cheap model, but
    # still the quota — this is the stage that decides how fast the whole feed can move.
    - cron: "10,40 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feed-classify
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    # Shorter than its own 30-minute cadence, so runs never queue up behind a
    # non-cancelling concurrency group.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: squelch classify

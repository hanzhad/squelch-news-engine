name: summarize

on:
  schedule:
    # Ten minutes behind classify, so it picks up what that run just kept.
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: summarize
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    # Shorter than its own 30-minute cadence, so runs never queue up behind a
    # non-cancelling concurrency group.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: squelch summarize

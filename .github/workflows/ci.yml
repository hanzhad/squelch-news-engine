name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per branch or PR: a superseded push has nothing left to tell us,
  # and this is the check every merge waits on.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The suite is offline by design — feed fixtures and fake HTTP clients —
      # so it needs no secrets and nothing here can reach the real API.
      - name: Test
        run: pytest -q

name: sources

# The scrape runs every half hour and is green whether it found anything or
# not, which is right — but it means a source that quietly stopped matching
# looks exactly like a source with no news. This job asks each of them for a
# couple of articles and goes red when one has nothing, so the rot arrives as a
# failure notification instead of as a silence nobody reads.

on:
  schedule:
    # Weekly. Sources rot on the scale of a site redesign, not of an afternoon,
    # and every run costs each of them a handful of requests.
    - cron: "17 6 * * 1"
  pull_request:
    # A selector edit is checked against the live page before it is merged.
    paths:
      - config/sources.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The browser extra too: a `web` source that silently degrades to "needs
      # Playwright" would be exactly the invisible failure this job is for.
      - name: Install
        run: |
          pip install -e '.[web]'
          playwright install --with-deps chromium

      # Read-only, but the `github` source type searches the API, and an
      # unauthenticated caller gets a budget small enough to make this job
      # flaky for reasons that have nothing to do with a source being broken.
      - name: Check sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: squelch check-sources

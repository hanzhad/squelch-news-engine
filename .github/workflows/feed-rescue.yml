name: feed / rescue voted

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Every twenty minutes. Reaction counts ride along on the issue listing, so a vote costs no
    # model call and has no reason to wait an hour. :19 lands one minute ahead of summarize, which
    # is the pass a rescued article needs.
    - cron: "19,39,59 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feed-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    # Nothing here talks to a model or a webhook — reaction counts ride along
    # on the issue listing — so a slow run just means GitHub is slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Rescue voted articles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: squelch rescue

name: feed / publish rejected

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Three times an hour. Rejections only trickle out of classify, so this is no delivery race, but
    # a webhook run is free and hourly was a cadence chosen when every slot was spoken for rather
    # than one this needed.
    - cron: "5,25,45 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feed-publish-rejected
  # Same reasoning as publish: the window between "posted to Discord" and
  # "labelled sent" is exactly where a cancellation would cause a double post.
  cancel-in-progress: false

jobs:
  publish-rejected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Post rejected
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_REJECTED_WEBHOOK_URL: ${{ secrets.DISCORD_REJECTED_WEBHOOK_URL }}
        run: squelch publish-rejected

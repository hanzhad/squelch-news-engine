name: feed / 1 scrape

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Twice an hour. This stage reaches no model and could run far more often, but classify is the
    # gate: scraping faster than the stage that consumes it only buys a deeper backlog of raw
    # issues. Raise classify first, this second.
    - cron: "0,30 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  # The dedup ledger is an issue too, so issue write covers everything here.
  issues: write

concurrency:
  group: feed-scrape
  # Never cancel. A killed run loses the seen-ledger write for issues it has
  # already created, and the next run would re-create them as duplicates.
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Scrape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: squelch scrape

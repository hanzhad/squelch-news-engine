name: feed / 3 summarize

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Ten minutes behind classify, so it picks up what that run just kept. The full model and the
    # most expensive call in the pipeline.
    - cron: "20,50 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feed-summarize
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    # Shorter than its own 30-minute cadence, so runs never queue up behind a
    # non-cancelling concurrency group.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Summarize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: squelch summarize

name: digest

on:
  schedule:
    # Monday morning UTC, once the week it summarises is actually over.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: >-
          Gemini model to write this digest with. Blank uses config/models.yaml.
          Free-tier quota is counted per model, so a second model is also the
          way to get a digest out when the usual one is spent.
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Weekly digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: a webhook for a channel of the digest's own. Unset means
          # the roundup lands in the feed channel with everything else.
          DISCORD_DIGEST_WEBHOOK_URL: ${{ secrets.DISCORD_DIGEST_WEBHOOK_URL }}
          # Whether that channel is a forum, where the roundup becomes a post
          # of its own named after the week's headline. Not a secret — it says
          # nothing an invite would not — so it is a repository variable.
          DIGEST_FORUM: ${{ vars.DIGEST_FORUM }}
          # Empty on the scheduled run, so config/models.yaml stays in charge.
          GEMINI_MODEL: ${{ inputs.model }}
        run: squelch digest --days 7

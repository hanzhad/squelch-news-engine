name: digest

on:
  schedule:
    # Monday morning UTC, once the week it summarises is actually over. Three
    # hours after the daily, so the two never land in the channel together.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: >-
          Gemini model to write this digest with. Blank uses config/models.yaml.
          Free-tier quota is counted per model, so a second model is also the
          way to get a digest out when the usual one is spent.
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # Writes the roundup into an issue and stops there. No webhook is touched
      # here: publish-digest.yml posts it, so a Discord outage costs a delay
      # rather than the whole week and one of the day's strong-model requests.
      - name: Weekly digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Empty on the scheduled run, so config/models.yaml stays in charge.
          GEMINI_MODEL: ${{ inputs.model }}
        run: squelch digest --period weekly

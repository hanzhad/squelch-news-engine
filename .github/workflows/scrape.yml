name: scrape

on:
  schedule:
    # Every 30 minutes, on the hour and the half hour. The filter runs ten
    # minutes later so it always sees the issues this run just created.
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The dedup ledger is an issue too, so issue write covers everything here.
  issues: write

concurrency:
  group: scrape
  # Never cancel. A killed run loses the seen-ledger write for issues it has
  # already created, and the next run would re-create them as duplicates.
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No requirements.txt here; the action falls back to pyproject.toml.
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Scrape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: squelch scrape

name: cases / 2 read

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # The one forum stage that spends a model request, so it keeps a sparse slot while ingest and
    # answer run every five minutes around it. That makes this the entire wait between a post and
    # its reply — raise it here if the forum ever feels slow, and nowhere else.
    - cron: "7,27,47 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cases-read
  cancel-in-progress: false

jobs:
  read-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Read the cases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: squelch read-cases

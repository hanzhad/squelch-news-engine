name: cases / 1 ingest

on:
  schedule:
    # schedule:begin — generated from config/schedule.yaml; edit there, `make schedule`
    # Every five minutes. Reading the forum costs a Discord connection and nothing else, so this
    # gets a post into the database almost at once and leaves the whole waiting time to
    # `cases-2-read`.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    # schedule:end
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cases-ingest
  # Two ingests overlapping would both see the same post as new and open two
  # issues for it — the dedup set is read once, at the start.
  cancel-in-progress: false

jobs:
  ingest-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-squelch

      - name: Read the forum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The one credential here that can read a channel. A webhook cannot,
          # which is the whole reason this stage needs a bot at all.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: squelch ingest-cases

name: filter

on:
  schedule:
    # Ten minutes behind scrape (which runs at :00 and :30), so a scrape has
    # finished creating issues before the filter goes looking for them.
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  # contents:read is what actions/checkout needs; declaring any permissions
  # block sets every scope not listed here to none.
  contents: read
  issues: write

concurrency:
  group: filter
  # Never cancel: a cancelled run has already spent Gemini quota on articles it
  # would then have to judge again.
  cancel-in-progress: false

jobs:
  filter:
    runs-on: ubuntu-latest
    # The stage paces itself against the Gemini free-tier rate limit, so it is
    # slow by design — but it must still finish inside its own 30-minute
    # cadence, or runs pile up behind the concurrency group forever. Anything
    # left over is picked up by the next tick.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Filter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: squelch filter

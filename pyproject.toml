[project]
name = "aetherfeed"
version = "0.1.0"
description = "Serverless news aggregation pipeline on GitHub Issues + Gemini"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
    "cssselect>=1.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "google-genai>=1.0",
    "typer>=0.15",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "feedgen>=1.0",
]

[project.scripts]
aetherfeed = "aetherfeed.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
]
web = [
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aetherfeed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
